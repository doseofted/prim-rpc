packages:
  - libs/*
  - apps/*

catalog:
  "@types/node": ^26.6.5
  typescript: 7.1.0-beta
  tsdown: ^0.23.1

engineStrict: true

minimumReleaseAge: 10080

skills:
  dirs:
    - .agents/skills

permissions:
  "@go-task/cli":
    build: true
  esbuild:
    build: true
  taze:
    skills: true

sideEffectsCache: false

supportedArchitectures:
  cpu: [current]
  os: [current]
